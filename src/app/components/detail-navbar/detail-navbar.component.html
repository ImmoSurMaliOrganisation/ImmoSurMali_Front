<nav
  class="fixed top-0 left-0 right-0 z-[100] h-20 bg-white/80 dark:bg-[#121212]/80 backdrop-blur-md border-b border-border/10 px-6 flex items-center transition-all animate-in fade-in slide-in-from-top duration-500"
>
  <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
    <div
      class="flex items-center gap-4 animate-in slide-in-from-left duration-700 delay-150 fill-mode-both"
    >
      <button
        (click)="goBack()"
        class="p-2 hover:bg-gray-100 dark:hover:bg-white/10 rounded-full transition-all active:scale-90 flex items-center gap-2 group"
      >
        <svg
          lucideArrowLeft
          class="w-6 h-6 group-hover:-translate-x-1.5 transition-transform duration-300 ease-out"
        ></svg>
        <span class="font-bold hidden md:block tracking-tight">Back</span>
      </button>
    </div>

    <div
      class="flex items-center gap-3 animate-in slide-in-from-right duration-700 delay-150 fill-mode-both"
    >
      <button
        (click)="scrollToBooking()"
        class="hidden md:flex items-center gap-2 px-6 py-2.5 bg-brand text-white rounded-2xl font-black text-sm shadow-lg shadow-brand/20 hover:scale-105 hover:shadow-brand/40 active:scale-95 transition-all duration-300 group"
      >
        <span>Book Now</span>
        <svg
          lucideCalendarCheck
          class="w-4 h-4 group-hover:rotate-12 transition-transform duration-300"
        ></svg>
      </button>

      <div class="w-[1px] h-6 bg-border/10 mx-2 hidden md:block"></div>

      <button
        (click)="toggleDarkMode()"
        class="p-2.5 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-all active:scale-75 duration-300"
      >
        @if (!isDark()) {
          <svg
            lucideMoon
            class="w-5 h-5 text-main-text animate-in zoom-in spin-in-90 duration-500"
          ></svg>
        } @else {
          <svg
            lucideSun
            class="w-5 h-5 text-yellow-400 animate-in zoom-in spin-in-180 duration-500"
          ></svg>
        }
      </button>
    </div>
  </div>
</nav>
