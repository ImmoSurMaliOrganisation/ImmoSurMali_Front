<nav
  class="fixed top-0 left-0 right-0 z-50 h-18 bg-white/80 dark:bg-[#121212]/80 backdrop-blur-md border-b border-border/10 px-6 md:px-12 flex items-center transition-colors duration-500">
  <div class="max-w-7xl mx-auto w-full flex justify-between items-center">
    <div routerLink="/properties" (click)="navService.setActiveTab('home')"
      class="flex items-center gap-2 cursor-pointer">
      <div class="w-12 h-12 bg-brand rounded-xl flex items-center justify-center text-white">
        <svg lucideHouse class="w-6 h-5"></svg>
      </div>
      <span class="hidden lg:block text-xl font-bold dark:text-white">ImmoSur Mali</span>
    </div>

    <div class="flex items-center gap-2">
      <button (click)="navService.setActiveTab('notifications')"
        class="flex hidden md:flex items-center gap-2 p-2.5 rounded-full relative hover:bg-gray-100 dark:hover:bg-white/10 text-foreground transition-all"
        [class.text-blue-500]="navService.activeTab() === 'notifications'">
        <div class="relative">
          <svg lucideBell class="w-6 h-6"></svg>
          <span
            class="absolute top-0.5 right-0.5 w-2.5 h-2.5 bg-blue-500 rounded-full border-2 border-white dark:border-[#121212]"></span>
        </div>
        <span class="hidden lg:block font-medium text-sm">Notifications</span>
      </button>

      <button (click)="navService.setActiveTab('favorites')"
        class="hidden md:flex flex items-center gap-2 p-2.5 rounded-full transition-all relative hover:bg-gray-100 dark:hover:bg-white/10"
        [class.text-brand]="navService.activeTab() === 'favorites'">
        <div class="relative">
          <svg lucideHeart class="w-6 h-6"></svg>
          <span
            class="absolute top-0.5 right-0.5 w-2.5 h-2.5 bg-brand rounded-full border-2 border-white dark:border-[#121212]"></span>
        </div>
        <span class="hidden md:block font-medium text-sm">My Favorites</span>
      </button>

      <button (click)="themeService.toggleDarkMode()"
        class="p-2.5 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition-all active:scale-90">
        @if (!themeService.isDark()) {
        <svg lucideMoon class="w-5 h-5 text-main-text"></svg>
        } @else {
        <svg lucideSun class="w-5 h-5 text-yellow-400"></svg>
        }
      </button>
      <button routerLink="/profile" (click)="navService.setActiveTab('profile')"
        class="flex hidden md:flex items-center gap-2 p-1 pr-4 rounded-full bg-slate-50 dark:bg-white/5 border border-border/50 hover:border-brand/50 transition-all cursor-pointer group">
        <div
          class="w-8 h-8 rounded-full overflow-hidden border-2 border-white dark:border-transparent group-hover:border-brand transition-colors">
          <img src="https://ui-avatars.com/api/?name=Moussa+Diarra&background=333&color=fff"
            class="w-full h-full object-cover" />
        </div>
        <span class="hidden lg:block font-bold text-xs text-main-text">Profile</span>
      </button>
    </div>
  </div>
</nav>

<div class="md:hidden fixed bottom-6 left-0 right-0 z-50 px-6 pointer-events-none">
  <div
    class="max-w-md mx-auto w-full bg-white/90 dark:bg-[#1A1A1A]/90 backdrop-blur-xl rounded-[2.5rem] h-16 px-8 flex items-center justify-between shadow-2xl pointer-events-auto border border-black/[0.05] dark:border-white/5 transition-all duration-500">
    <button routerLink="/properties" (click)="navService.setActiveTab('home')"
      class="p-2 transition-colors duration-300 cursor-pointer active:scale-90"
      [class.text-brand]="navService.activeTab() === 'home'" [class.text-slate-400]="navService.activeTab() !== 'home'">
      <svg lucideSearch class="w-6 h-6"></svg>
    </button>

    <button (click)="navService.setActiveTab('maps')"
      class="p-2 flex flex-col items-center gap-1 transition-all duration-300 cursor-pointer active:scale-90"
      [class.text-brand]="navService.activeTab() === 'maps'" [class.text-slate-400]="navService.activeTab() !== 'maps'">
      <svg lucideMap class="w-6 h-6"></svg>
    </button>

    <button (click)="navService.setActiveTab('favorites')"
      class="p-2 flex flex-col items-center gap-1 transition-all duration-300 cursor-pointer active:scale-90"
      [class.text-brand]="navService.activeTab() === 'favorites'"
      [class.text-slate-400]="navService.activeTab() !== 'favorites'">
      <svg lucideHeart class="w-6 h-6"></svg>
    </button>

    <button routerLink="/profile" (click)="navService.setActiveTab('profile')"
      class="p-2 flex flex-col items-center gap-1 transition-all duration-300 cursor-pointer active:scale-90"
      [class.text-brand]="navService.activeTab() === 'profile'"
      [class.text-slate-400]="navService.activeTab() !== 'profile'">
      <svg lucideUser class="w-6 h-6"></svg>
    </button>
  </div>
</div>
