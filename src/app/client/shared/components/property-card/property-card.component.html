@let p = property();

<div
  routerLink="/property/{{ p.id }}"
  class="group bg-card-bg border border-border rounded-[2rem] md:rounded-3xl overflow-hidden shadow-bento hover:shadow-bento-hover transition-all duration-500"
>
  <!-- Section Image : Hauteur réduite sur mobile (h-48) et plus grande sur desktop (md:h-64) -->
  <div class="relative h-48 md:h-64 m-2 md:m-3 overflow-hidden rounded-[1.5rem] md:rounded-2xl">
    <img
      [src]="p.image"
      loading="lazy"
      decoding="async"
      (error)="onImageError($event)"
      class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
      alt="Property image"
    />

    <div
      class="absolute top-3 left-3 bg-white/90 dark:bg-black/60 backdrop-blur-md px-3 py-1 rounded-full shadow-sm md:opacity-80 md:group-hover:opacity-100 transition-all duration-500"
    >
      <span class="text-[9px] md:text-[10px] font-bold uppercase tracking-tighter">{{
        p.type
      }}</span>
    </div>
    <button
      (click)="onHeartClick($event)"
      class="absolute top-3 right-3 p-2.5 dark:text-white rounded-full backdrop-blur-md transition-all active:scale-90 z-10 border border-transparent hover:bg-red-50 hover:text-brand hover:border-brand/20"
      [class.text-brand]="isFavorite()"
      [class.bg-red-50]="isFavorite()"
      [class.dark:bg-red-950/20]="isFavorite()"
      aria-label="Add to favorites"
    >
      <svg
        lucideHeart
        class="w-6 h-6 transition-all duration-300"
        [class.fill-brand]="isFavorite()"
        [class.scale-110]="isFavorite()"
      ></svg>
    </button>
  </div>

  <div class="px-4 pb-4 pt-1 md:pt-2">
    <div class="flex justify-between items-start mb-3 md:mb-4">
      <div class="max-w-[60%]">
        <p class="text-[9px] uppercase tracking-widest text-text-muted font-bold mb-0.5">
          Category
        </p>
        <h3 class="text-lg md:text-xl font-extrabold text-main-text leading-tight truncate">
          {{ p.category }}
        </h3>
        <div class="flex items-center gap-1 mt-0.5">
          <svg lucideMapPin class="w-3 h-3 text-brand/60"></svg>
          <p class="text-[10px] md:text-xs text-text-muted font-medium truncate italic">
            {{ p.location }}
          </p>
        </div>
      </div>
      <div class="text-right">
        <p class="text-[9px] uppercase tracking-widest text-text-muted font-bold mb-0.5">Price</p>
        <p class="text-lg md:text-xl font-extrabold text-brand whitespace-nowrap">
          {{ p.price | number: '1.0-0' }} €
          @if (p.period) {
            <span class="text-[10px] md:text-xs font-medium text-text-muted">
              /{{ p.period }}
            </span>
          }
        </p>
      </div>
    </div>

    <!-- Diviseur (Plus discret sur mobile) -->
    <div class="flex items-center gap-2 mb-1 md:mb-1">
      <div class="h-[1px] flex-1 bg-border/50"></div>
      <svg lucideHome class="w-3 h-3 md:w-4 md:h-4 text-brand/20"></svg>
      <div class="h-[1px] flex-1 bg-border/50"></div>
    </div>

    <!-- Caractéristiques : Grille 3 colonnes qui reste lisible -->
    <div
      class="grid grid-cols-3 gap-1 md:gap-2 bg-gray-50/50 dark:bg-neutral-900/50 p-1 md:p-1 rounded-2xl border border-border/40"
    >
      <div class="text-center">
        <svg lucideBedDouble class="w-3.5 h-3.5 md:w-4 md:h-4 mx-auto mb-1 text-brand"></svg>
        <p class="font-bold text-xs md:text-sm">{{ p.beds }}</p>
        <p class="text-[8px] text-text-muted uppercase tracking-tighter">Beds</p>
      </div>
      <div class="text-center border-x border-border/60">
        <svg lucideBath class="w-3.5 h-3.5 md:w-4 md:h-4 mx-auto mb-1 text-brand"></svg>
        <p class="font-bold text-xs md:text-sm">{{ p.baths }}</p>
        <p class="text-[8px] text-text-muted uppercase tracking-tighter">Baths</p>
      </div>
      <div class="text-center">
        <svg lucideMaximize class="w-3.5 h-3.5 md:w-4 md:h-4 mx-auto mb-1 text-brand"></svg>
        <p class="font-bold text-xs md:text-sm">{{ p.sqft }}</p>
        <p class="text-[8px] text-text-muted uppercase tracking-tighter">m²</p>
      </div>
    </div>
  </div>
</div>
